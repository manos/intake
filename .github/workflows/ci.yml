name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python -m venv .venv && .venv/bin/pip install uv && .venv/bin/uv sync --locked --extra dev
      - run: .venv/bin/python -m pytest backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker compose build
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python -m venv .venv && .venv/bin/pip install uv && .venv/bin/uv sync --locked
      - name: Test native journal against FastAPI
        env:
          ALLOW_SIGNUP: 'true'
          INTAKE_INTEROP_ORIGIN: http://127.0.0.1:18543
        run: |
          export CONFIG_DIR="$(mktemp -d)"
          .venv/bin/python -m uvicorn backend.app:app --host 127.0.0.1 --port 18543 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS "$INTAKE_INTEROP_ORIGIN/health"
          swift test --package-path ios
      - name: Build iPhone app
        run: xcodebuild -project ios/Intake.xcodeproj -scheme Intake -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
