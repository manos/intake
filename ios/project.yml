name: Intake
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  IntakeKit:
    path: .
targets:
  Intake:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: IntakeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manos.intake
        PRODUCT_NAME: Intake
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Intake connects to your self-hosted journal when you enable sync.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Intake:
    build:
      targets:
        Intake: all
